name: 容器验证
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh scripts/smoke-docker.sh
      - if: always()
        run: mkdir -p artifacts && docker compose logs --no-color > artifacts/container.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: artifacts/
