name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race -timeout 180s ./...
        env:
          REQUIRE_MEDIA_TESTS: "1"
      - run: go vet ./...
      - run: go run ./cmd/specgen && git diff --exit-code api/openapi.json
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: web
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh scripts/smoke-docker.sh
      - if: always()
        run: mkdir -p artifacts && docker compose logs --no-color > artifacts/container.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: artifacts/
