name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node --test scripts/ci.test.mjs scripts/parity-browser.test.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race -timeout 180s ./...
        env:
          REQUIRE_MEDIA_TESTS: "1"
          # Fake native tools reuse the race-instrumented test binary. Avoid a
          # one-second exit sleep per subprocess; race reporting stays enabled.
          GORACE: "atexit_sleep_ms=0"
      - run: go vet ./...
      - run: go run ./cmd/specgen && git diff --exit-code api/openapi.json
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: web
