name: autoclip-go
x-common: &common
  image: autoclip-go:0.1.0
  init: true
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  tmpfs:
    - /tmp:rw,exec,nosuid,size=1g,uid=10001,gid=10001,mode=1770
  volumes:
    - data:/data
    - models:/models
  environment:
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-4294967296}
    MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-7200}
    TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-21600}
    AUTOCLIP_TEXT_BASE_URL: ${AUTOCLIP_TEXT_BASE_URL:-}
    AUTOCLIP_TEXT_MODEL: ${AUTOCLIP_TEXT_MODEL:-}
    AUTOCLIP_TEXT_API_KEY: ${AUTOCLIP_TEXT_API_KEY:-}
    AUTOCLIP_VISION_BASE_URL: ${AUTOCLIP_VISION_BASE_URL:-}
    AUTOCLIP_VISION_MODEL: ${AUTOCLIP_VISION_MODEL:-}
    AUTOCLIP_VISION_API_KEY: ${AUTOCLIP_VISION_API_KEY:-}
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"
services:
  web:
    <<: *common
    build:
      context: .
      args:
        APT_SOURCE_MODE: ${APT_SOURCE_MODE:-mirror}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://deb.debian.org/debian-security}
        DEBIAN_SNAPSHOT: ${DEBIAN_SNAPSHOT:-20260901T000000Z}
    command: [web]
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-8080}:8080"
    healthcheck:
      test: [CMD, autoclip, healthcheck]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
  worker:
    <<: *common
    # web builds this exact image before worker starts; no duplicate build/pull.
    pull_policy: never
    command: [worker]
    stop_grace_period: 30s
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, autoclip, healthcheck, worker]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
volumes:
  data:
  models:
